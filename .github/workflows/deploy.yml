name: Deploy Chamada Discipulado

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build React web app
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install React web dependencies
        run: npm ci --prefix web
      - name: Build React web
        run: npm --prefix web run build
        env:
          VITE_API_BASE_URL: https://discipulado.bibliafoco.com.br/api
      - name: Configure Apache client-side routing
        run: |
          printf 'Options -MultiViews\nRewriteEngine On\nRewriteCond %%{HTTP:Upgrade} =websocket [NC]\nRewriteRule ^ws$ ws://127.0.0.1:2000/ws [P,L]\nRewriteCond %%{REQUEST_FILENAME} !-f\nRewriteCond %%{REQUEST_FILENAME} !-d\nRewriteRule ^ index.html [QSA,L]\n' > web/dist/.htaccess

      - name: Build API Docker image
        run: docker build -t chamada-discipulado-api:latest ./api

      - name: Package API image
        run: docker save chamada-discipulado-api:latest | gzip > chamada-api-image.tar.gz

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Copy artifacts to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /root/ChamadaDiscipulado/deploy-artifacts'
          scp chamada-api-image.tar.gz docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/root/ChamadaDiscipulado/deploy-artifacts/"
          rsync -az --delete web/dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/discipulado/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'rm -f /var/www/discipulado/relatorios/frequencia.html'

      - name: Activate deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; gunzip -c /root/ChamadaDiscipulado/deploy-artifacts/chamada-api-image.tar.gz | docker load; cp /root/ChamadaDiscipulado/deploy-artifacts/docker-compose.yml /root/ChamadaDiscipulado/docker-compose.yml; pm2 delete chamada-discipulado || true; cd /root/ChamadaDiscipulado; docker compose up -d --remove-orphans; for i in $(seq 1 30); do if [ "$(docker inspect -f "{{.State.Running}}" chamada-discipulado-api 2>/dev/null)" = "true" ]; then break; fi; sleep 1; done; docker exec chamada-discipulado-api node ace migration:run --force; for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:2000/ >/dev/null; then docker image prune -af; rm -rf /root/ChamadaDiscipulado/deploy-artifacts; exit 0; fi; sleep 2; done; docker logs --tail=80 chamada-discipulado-api; exit 1'
